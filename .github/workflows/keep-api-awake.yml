# Render's free tier sleeps a service after 15 minutes idle, and waking it
# takes 30-45 seconds. A visitor arriving cold sees an app that looks broken.
#
# Budget: the free plan allows 750 instance-hours a month ACROSS THE ACCOUNT,
# and this account also runs the Fable API. A service pinged every 10 minutes
# stays up for the whole window, so:
#
#   24h/day x 31 x 2 services = 1488h  -> blows the quota, services suspended
#   10h/day x 31 x 2 services =  620h  -> fits, with ~130h to spare
#
# Hence the window rather than round-the-clock. Outside it the API sleeps and
# the first visitor pays the cold start; run this workflow manually from the
# Actions tab before sending an application to warm it on demand.
name: Keep API awake

on:
  schedule:
    # Every 10 minutes, 04:00-13:59 UTC = 10:00-19:59 Bangladesh (UTC+6).
    - cron: "*/10 4-13 * * *"
  workflow_dispatch:

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API until it answers
        run: |
          URL="https://wanderly-travel-agency.onrender.com/api/packages"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::API did not return 200 after 3 attempts — it may be down."
          exit 1
